; Legacy v0.5 INI configuration (active dataset only). Still read by the v0.5-compatible INI loader.
; The archived dataset blocks now live in configs/datasets/*.toml; all keys are documented in
; configs/template.toml. Convert with: python -m synphly convert-config config.ini <out>.toml
[globals]
experiment_name = 21A-024.sb39746934.eb40140855.59469.05998622686_K
; the output measurement set, whithout the .ms extension

working_directory = /media/sagauga/galnet/Sy_v6_test/21A-024.sb39746934.eb40140855.59469.05998622686_Sy_v6/
; directory to strore all data products

asdm_file = /media/sagauga/galnet/Sy_v6_test/21A-024.sb39746934.eb40140855.59469.05998622686_Sy_v6/21A-024.sb39746934.eb40140855.59469.05998622686_K
; if non existent, leave the same as experiment_name, e.g. VISIBILITY_DATA


load_data = True
run_only_ms_info = False
do_hanning = False
use_singularity = False
singularity_path =
ms_info = True
report_verbosity = 3

[sources]
flux_calibrator = 
bandpass_calibrator = 
phase_calibrator = 
target = 
; use this to manually set the VALID  transfer fields IDs (flux calibrator itself, phase calibrators + bandpass calibrator)
; this will be used in the fluxscale task
transfer = 
; use this to manually set the VALID reference field ID of the flux calibrator.
; this will be used in the fluxscale task
reference = 


[flagging]
do_flagging = True
do_pre_flagging = True
use_aoflagger = False
do_tfcrop_raw = True
aoflagger_sif = /singularity_containers/lofar_aoflagger_3.1.0.sif
aoflagger_strategy = ./aoflagger_strategies/jvla-default.lua
manual_file = 
edge_channel_frac = 0.2
edge_channel_flag_frac_cals = 0.06
edge_channel_flag_frac_science = 0.03
do_flag_edge_channels_cals = True
do_flag_edge_channels_science = True
do_flag_pointing_scans = True

cals_flag_mode_strategy = rflag
cals_datacolumn_to_flag = residual
science_flag_mode_strategy = rflag
science_datacolumn_to_flag = residual
ntime= scan
combinescans = False
tfcrop_timecutoff_cals = 4.0
tfcrop_freqcutoff_cals = 4.0
tfcrop_freqcutoff_science = 4.0
tfcrop_timecutoff_science =4.0
rflag_timedevscale_cals = 4.0
rflag_freqdevscale_cals = 4.0
rflag_timedevscale_science = 4.0
rflag_freqdevscale_science = 4.0
maxnpieces = 5
winsize = 5
do_clip_data = True
clipmin = 0
#for safety, set to 50 (instead of 30).
clipmax = 50
; be cautious if any of your source has flux density higher than clip_max. 


[average]
do_average = True
time_avg = True
timebin_avg = 3s
channel_avg = False
; we select the desired number of output channels (not the avg factor).
chan_out_avg = 32
; bug to fix: it gives an error if any of the channels in the MS is lower than chan_out_avg.

[calibrate]
do_initial_cal = True
do_setjy = True
do_refant = True
; refant = ea12,ea13,ea02
refant = None
; Note: if Ka band, should use band A; if Ku, shoud use band U. 
band = K

bp_solint_K = inf
minsnr_K = 3.0

bp_solint_G_p = 18s
minsnr_bp_G_p = 3.0
bp_solint_G_ap = 36s
bp_solint_BP = inf
minsnr = 3.0

all_solint_short_p = 18s
all_solint_short_ap = 36s
all_solint_long_p = inf
all_solint_inf_ap = inf
; bp_applymode = calflagstrict
; ph_ap_applymode = calflagstrict
; science_applymode = calflagstrict
bp_applymode = calflag
ph_ap_applymode = calflag
science_applymode = calflagstrict


bp_fillgaps = 8


do_bandpass_1st_run = True
do_gain_calibration_1st_run = True
do_apply_science_1st_run = True
calwt_1st = True

do_bandpass_2nd_run = True
do_gain_calibration_2nd_run = True

; avoid corrupting the data (e.g. do not apply again the gain calibration factors); we require only one weight calibration.
calwt_2nd = False


do_apply_science = True
do_flag_science = True

; We are making some tests with False. If calwt was applied before, then statwt may not be needed.
do_run_statwt = False

statwt_timebin = 12s
statwt_statalg = chauvenet

do_split = True
timebin_longer = 6s

; --------
; not used for now
timebin = 6s
width = 1
solint = 60s
; --------



[imaging]
; implementing
do_imaging = False
imager = tclean
parallel = False
