; if non existent, leave the same as experiment_name, e.g. VISIBILITY_DATA

load_data = True
run_only_ms_info = False
do_hanning = False
use_singularity = False
singularity_path =
ms_info = True
report_verbosity = 3

[sources]
flux_calibrator = 3C48
bandpass_calibrator = 3C48
phase_calibrator = J1955+1358,J2051+1743,J2123+5500,J0410+7656
target = IRAS19542+1110,CGCG448-020,IRAS21101+5810,VIIZw031
; flux_calibrator = 1331+305=3C286
; bandpass_calibrator = 1331+305=3C286
; phase_calibrator = J0541+5312,J1128+5925,J1308+3546
; target = MCG+08-11-002,Arp299,UGC8387
; flux_calibrator = 0
; bandpass_calibrator = 0
; phase_calibrator = 1,3,5
; target = 2,4,6


; use this to manually set the VALID  transfer fields IDs (phase calibrators + bandpass calibrator)
; this will be used in the fluxscale task
transfer = 0,2,5,8,11
; use this to manually set the VALID reference field ID of the flux calibrator.
; this will be used in the fluxscale task
reference = 0


[flagging]
do_flagging = True
do_pre_flagging = True
use_aoflagger = False
do_tfcrop_raw = True
aoflagger_sif = /singularity_containers/lofar_aoflagger_3.1.0.sif
aoflagger_strategy = ./aoflagger_strategies/jvla-default.lua
manual_file = 
edge_channel_frac = 0.15
edge_channel_flag_frac_cals = 0.05
edge_channel_flag_frac_science = 0.03
do_flag_edge_channels_cals = True
do_flag_edge_channels_science = True

cals_flag_mode_strategy = rflag
cals_datacolumn_to_flag = corrected
science_flag_mode_strategy = rflag
science_datacolumn_to_flag = corrected
ntime= scan
combinescans = False
tfcrop_timecutoff_cals = 4.0
tfcrop_freqcutoff_cals = 4.0
tfcrop_freqcutoff_science = 4.0
tfcrop_timecutoff_science =4.0
rflag_timedevscale_cals = 4.0
rflag_freqdevscale_cals = 4.0
rflag_timedevscale_science = 4.0
rflag_freqdevscale_science = 4.0
maxnpieces = 5
winsize = 5
do_clip_data = True
clipmin = 0
#for safety, set to 50 (instead of 30).
clipmax = 50
; be cautious if any of your source has flux density higher than clip_max. 


[average]
do_average = True
time_avg = True
timebin_avg = 3s
channel_avg = True
; we select the desired number of output channels (not the avg factor).
chan_out_avg = 64
; bug to fix: it gives an error if any of the channels in the MS is lower than chan_out_avg.

[calibrate]
do_initial_cal = True
do_setjy = True
do_refant = True
; refant = ea12,ea13,ea02
refant = None
; Note: if Ka band, should use band A; if Ku, shoud use band U. 
band = A



bp_solint_K = inf
minsnr_K = 5.0

bp_solint_G_p = 60s
minsnr_bp_G_p = 5.0
bp_solint_G_ap = 60s
bp_solint_BP = inf
minsnr = 3.0

all_solint_short_p = 24s
all_solint_short_ap = 48s
all_solint_long_p = inf
all_solint_inf_ap = inf
; bp_applymode = calflagstrict
; ph_ap_applymode = calflagstrict
; science_applymode = calflagstrict
bp_applymode = calflag
ph_ap_applymode = calflag
science_applymode = calflagstrict


bp_fillgaps = 6


do_bandpass_1st_run = True
do_gain_calibration_1st_run = True
do_apply_science_1st_run = True
calwt_1st = True

do_bandpass_2nd_run = True
do_gain_calibration_2nd_run = True

; avoid corrupting the data (e.g. do not apply again the gain calibration factors); we require only one weight calibration.
calwt_2nd = False


do_apply_science = True
do_flag_science = True

; We are making some tests with False. If calwt was applied before, then statwt may not be needed.
do_run_statwt = False

statwt_timebin = 12s
statwt_statalg = chauvenet

do_split = True
timebin_longer = 6s

; --------
; not used for now
timebin = 6s
width = 1
solint = 60s
; --------



[imaging]
; implementing
do_imaging = False
imager = tclean
parallel = False
